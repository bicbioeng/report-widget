name: ci

on:
  pull_request:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Fixtures install the packed tarball, exactly what a consumer gets.
      - run: npm run pack:fixtures
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: fixtures/vite
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: fixtures/next
        env: { NEXT_TELEMETRY_DISABLED: '1' }

  dist-is-current:
    # Consumers install the committed dist/ straight from a tag, so it must match the source.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: test -z "$(git status --porcelain -- dist styles.css)" || (echo "dist/ or styles.css is stale: run npm run build and commit it" && exit 1)
      - name: A release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
